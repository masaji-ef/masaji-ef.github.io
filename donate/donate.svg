<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="btc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a"/>
      <stop offset="100%" style="stop-color:#f7931a"/>
    </linearGradient>
    <linearGradient id="ton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0088cc"/>
      <stop offset="100%" style="stop-color:#00a8e8"/>
    </linearGradient>
    <linearGradient id="usdt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26a17b"/>
      <stop offset="100%" style="stop-color:#2ecc71"/>
    </linearGradient>
    <linearGradient id="xmr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6600"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!--
    ИДЕАЛЬНАЯ ГЕОМЕТРИЯ 2×2:
    Отступ со всех сторон: 60px
    Зазор между ячейками: 40px
    Размер ячейки: (1024 - 60*2 - 40) / 2 = 432px
    Все ячейки строго 1:1
  -->

  <!-- РЯД 1 -->
  <g transform="translate(60, 60)">
    <!-- GRAM -->
    <rect x="0" y="0" width="432" height="432" fill="#1a1a2e" rx="16" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <image x="66" y="20" width="300" height="300" xlink:href="GRAM.png"/>
    <text x="216" y="370" font-family="monospace" font-size="26" fill="url(#ton)" font-weight="bold" text-anchor="middle">⧫ GRAM</text>
    <text x="216" y="398" font-family="monospace" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">Network: TON</text>

    <!-- USDT -->
    <rect x="472" y="0" width="432" height="432" fill="#1a1a2e" rx="16" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <image x="538" y="20" width="300" height="300" xlink:href="USDT_TON.png"/>
    <text x="688" y="370" font-family="monospace" font-size="26" fill="url(#usdt)" font-weight="bold" text-anchor="middle">$ USDT</text>
    <text x="688" y="398" font-family="monospace" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">Network: TON</text>
  </g>

  <!-- РЯД 2 -->
  <g transform="translate(60, 532)">
    <!-- BTC -->
    <rect x="0" y="0" width="432" height="432" fill="#1a1a2e" rx="16" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <image x="66" y="20" width="300" height="300" xlink:href="BTC.png"/>
    <text x="216" y="370" font-family="monospace" font-size="26" fill="url(#btc)" font-weight="bold" text-anchor="middle">₿ BTC</text>
    <text x="216" y="398" font-family="monospace" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">Network: BTC</text>

    <!-- XMR -->
    <rect x="472" y="0" width="432" height="432" fill="#1a1a2e" rx="16" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <image x="538" y="20" width="300" height="300" xlink:href="XMR.png"/>
    <text x="688" y="370" font-family="monospace" font-size="26" fill="url(#xmr)" font-weight="bold" text-anchor="middle">XMR</text>
    <text x="688" y="398" font-family="monospace" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">Network: Monero</text>
  </g>
</svg>
